<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#20232b">
	<title>Log In | Discord</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: "Segoe UI", "Trebuchet MS", sans-serif;
			background: #20232b;
			color: #f4f5f7;
			font-synthesis: none;
			text-rendering: optimizeLegibility;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 28px;
			overflow-x: hidden;
			background-color: #20232b;
			background-image:
				radial-gradient(ellipse at 14% 84%, rgba(53, 190, 180, .18), transparent 30%),
				radial-gradient(ellipse at 88% 16%, rgba(88, 101, 242, .24), transparent 32%),
				linear-gradient(135deg, #20232b 0%, #252a37 52%, #20232b 100%);
		}

		.login-shell {
			width: min(100%, 880px);
			min-height: 490px;
			display: grid;
			grid-template-columns: minmax(0, 1fr) 270px;
			gap: 46px;
			align-items: center;
			padding: 46px 48px;
			border: 1px solid rgba(255, 255, 255, .08);
			border-radius: 8px;
			background: #31343c;
			box-shadow: 0 24px 70px rgba(0, 0, 0, .34);
			animation: arrive .5s ease-out both;
		}

		.brand {
			display: inline-flex;
			align-items: center;
			gap: 9px;
			margin-bottom: 30px;
			color: #fff;
			font-size: 15px;
			font-weight: 800;
			letter-spacing: .4px;
		}

		.brand-mark { width: 30px; height: 24px; color: #f4f5f7; }

		h1 {
			margin: 0;
			font-size: 25px;
			font-weight: 700;
			line-height: 1.25;
		}

		.subtitle {
			margin: 9px 0 25px;
			color: #b5bac1;
			font-size: 15px;
		}

		.field { margin-bottom: 19px; }

		label {
			display: block;
			margin-bottom: 8px;
			color: #dbdee1;
			font-size: 12px;
			font-weight: 700;
			letter-spacing: .35px;
			text-transform: uppercase;
		}

		input {
			width: 100%;
			height: 46px;
			padding: 0 13px;
			border: 1px solid #202127;
			border-radius: 4px;
			outline: none;
			background: #25272e;
			color: #f4f5f7;
			font: inherit;
			transition: border-color .16s, box-shadow .16s;
		}

		input:focus {
			border-color: #7b86ff;
			box-shadow: 0 0 0 3px rgba(88, 101, 242, .22);
		}

		.text-link {
			color: #00a8fc;
			font-size: 14px;
			text-decoration: none;
		}

		.text-link:hover { text-decoration: underline; }

		.forgot { display: inline-block; margin-top: -9px; margin-bottom: 20px; }

		.submit-button {
			width: 100%;
			min-height: 46px;
			border: 0;
			border-radius: 4px;
			background: #5865f2;
			color: #fff;
			cursor: pointer;
			font: inherit;
			font-weight: 700;
			transition: background .16s, transform .16s;
		}

		.submit-button:hover { background: #4752c4; }
		.submit-button:active { transform: translateY(1px); }

		.register-line {
			margin: 17px 0 0;
			color: #949ba4;
			font-size: 14px;
		}

		.qr-panel { text-align: center; }

		.qr-art {
			width: 168px;
			height: 168px;
			margin: 0 auto 22px;
			padding: 12px;
			border-radius: 6px;
			background: #fff;
		}

		.qr-art svg { display: block; width: 100%; height: 100%; }

		.qr-panel h2 {
			margin: 0 0 10px;
			font-size: 21px;
			line-height: 1.25;
		}

		.qr-panel p {
			margin: 0;
			color: #b5bac1;
			font-size: 14px;
			line-height: 1.5;
		}

		.notice {
			min-height: 20px;
			margin: 10px 0 0;
			color: #ffd479;
			font-size: 13px;
		}

		@keyframes arrive {
			from { opacity: 0; transform: translateY(8px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 680px) {
			body { padding: 18px; }
			.login-shell {
				width: min(100%, 440px);
				min-height: 0;
				grid-template-columns: 1fr;
				gap: 30px;
				padding: 30px 25px;
			}
			.brand { margin-bottom: 23px; }
			.qr-panel {
				display: grid;
				grid-template-columns: 92px 1fr;
				gap: 0 17px;
				align-items: center;
				padding-top: 24px;
				border-top: 1px solid rgba(255, 255, 255, .1);
				text-align: left;
			}
			.qr-art {
				width: 92px;
				height: 92px;
				grid-row: span 2;
				margin: 0;
				padding: 7px;
			}
			.qr-panel h2 { align-self: end; font-size: 17px; }
			.qr-panel p { align-self: start; font-size: 13px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
		}
	</style>
</head>
<body>
	<main class="login-shell">
		<section aria-labelledby="login-title">
			<div class="brand" aria-label="Discord">
				<svg class="brand-mark" viewBox="0 0 128 96" aria-hidden="true">
					<path fill="currentColor" d="M104.4 8.5A105 105 0 0 0 78.8.6a72 72 0 0 0-3.3 6.8 97 97 0 0 0-23 0A72 72 0 0 0 49.2.6a105 105 0 0 0-25.7 8C7.3 32.5 2.9 56 5.1 79.1A104 104 0 0 0 36.7 95a77 77 0 0 0 6.8-11 68 68 0 0 1-10.7-5.1l2.6-2a74 74 0 0 0 57.2 0l2.6 2a68 68 0 0 1-10.7 5.1 77 77 0 0 0 6.8 11 104 104 0 0 0 31.6-15.9c2.7-26.8-4.6-50.1-18.5-70.6ZM42.5 64.8c-5.7 0-10.4-5.2-10.4-11.6s4.6-11.7 10.4-11.7 10.5 5.3 10.4 11.7c0 6.4-4.6 11.6-10.4 11.6Zm43 0c-5.7 0-10.4-5.2-10.4-11.6s4.6-11.7 10.4-11.7S96 46.8 96 53.2s-4.6 11.6-10.4 11.6Z"/>
				</svg>
				DISCORD
			</div>
			<h1 id="login-title">Welcome back!</h1>
			<p class="subtitle">We're so excited to see you again!</p>

			<form id="login-form">
				<div class="field">
					<label for="email">Email or phone number</label>
					<input id="email" name="email" type="text" autocomplete="username" required>
				</div>
				<div class="field">
					<label for="password">Password</label>
					<input id="password" name="password" type="password" autocomplete="current-password" required>
				</div>
				<a class="text-link forgot" href="#forgot-password">Forgot your password?</a>
				<button class="submit-button" type="submit">Log In</button>
				<p class="notice" id="notice" role="status" aria-live="polite"></p>
			</form>
			<p class="register-line">Need an account? <a class="text-link" href="#register">Register</a></p>
		</section>

		<aside class="qr-panel" aria-label="Log in with a QR code">
			<div class="qr-art" aria-hidden="true">
				<svg viewBox="0 0 21 21" shape-rendering="crispEdges">
					<rect width="21" height="21" fill="#fff"/>
					<path fill="#20232b" d="M1 1h7v7H1zm1 1v5h5V2zm1 1h3v3H3zM13 1h7v7h-7zm1 1v5h5V2zm1 1h3v3h-3zM1 13h7v7H1zm1 1v5h5v-5zm1 1h3v3H3zM10 1h1v2h-1zm-1 3h2v1H9zm1 2h2v2h-2zm2-1h1v2h-1zm-3 4h2v1H9zm3 0h2v2h-2zm3 0h2v1h-2zm3 0h1v2h-1zm-8 2h2v1h-2zm3 0h1v2h-1zm3 0h2v1h-2zm-7 2h2v2h-2zm3 1h2v1h-2zm3-1h1v2h-1zm2 2h2v1h-2zm-8 2h1v2h-1zm2 0h2v1h-2zm3 1h2v2h-2zm3-1h1v2h-1z"/>
				</svg>
			</div>
			<h2>Quick sign-in</h2>
			<p>QR sign-in is not connected in this demo.</p>
		</aside>
	</main>

	<script>
		document.getElementById("login-form").addEventListener("submit", function (event) {
			event.preventDefault();
			document.getElementById("notice").textContent = "Demo only: sign-in is not connected.";
		});
	</script>
</body>
</html>
